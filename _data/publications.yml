- title: "Uncovering functional balance in pituitary baseline states"
  authors: "A. Aquiles, P. Mollard"
  venue: "Journal of Neuroendocrinology"
  link: "COMING SOON"
  pdf: ""
  abstract: "The pituitary gland serves as the master regulator of endocrine function, exhibiting complex and dynamic behaviors that enable it to meet the body’s continuously changing physiological demands. While the gland’s responsiveness to hormonal cues is well documented, its intrinsic spontaneous activity emerging in the absence of external stimuli, remains less understood yet critically important ... "

- title: "Population geometry reveals directed coupling and transient bistability in spontaneous pituitary secretion"
  authors: "Ana Aquiles, Aparicio Arias Juri, Lafont Chrystel, David J. Hodson, Santiago-Andres Yorgui, Patrice Mollard and Tatiana Fiordelisio"
  venue: "BiorXiv"
  link: "https://doi.org/10.64898/2026.04.05.716480 "
  pdf: "/assets/papers/Bio2026.pdf"
  abstract: "The pituitary gland operates as an organized signaling network in which endocrine cell populations coordinate hormone secretion, through homotypic and heterotypic interactions, yet the contribution of spontaneous intrinsic activity in shaping population-level dynamics remains poorly understood..."
  
- title: "Assessing the degree of cortical dislamination through electrical pattern analysis"
  authors: "Ana Aquiles, Laura Pinedo, Mirelta Regalado, Hiram Luna-Munguia, Fernando Peña-Ortega, Luis Concha and Román Rossi-Pool"
  venue: "iScience"
  link: "DOI: 10.1016/j.isci.2026.115942"
  pdf: "/assets/papers/iSci2026.pdf"
  abstract: "Focal cortical dysplasia (FCD) is a leading cause of pharmacoresistant epilepsy in pediatric populations, yet its role in epileptogenesis remains incompletely understood. Recent findings suggest that hyperexcitability may originate in non-dysplastic peripheral areas rather than the malformation itself. However, given the significant variability across FCD cases, clarifying whether cytoarchitectural disorganization drives activity changes remains challenging..."

- title: "Association between Intracellular Calcium Signaling and Tumor Recurrence in Human Non-Functioning Pituitary Adenomas"
  authors: " Yorgui Santiago-Andres, Ana Aquiles, Keiko Taniguchi-Ponciano, Latife Salame, Gerardo Guinto, Moises Mercado and Tatiana Fiordelisio"
  venue: "International Journal of Molecular Sciences"
  link: "https://doi.org/10.3390/ijms25073968"
  pdf: "/assets/papers/MolEndo2024.pdf"
  abstract: "Clinically non-functioning pituitary adenomas (CNFPAs) are the second most frequent sellar tumor among studies on community-dwelling adults. They are characterized by the absence of hormonal hypersecretion syndrome, and patients present with compressive symptoms, such as a headache and visual field defects. Immunohistochemically, most CNFPAs are of gonadotrope differentiation, with only a few of them being truly null cell adenomas. Although these tumors express receptors for one or more hypothalamic releasing hormones, to what extent this has an impact on the biological and clinical behavior of these neoplasms remains to be defined ..."

- title: "Altered functional connectivity and network excitability in a model of cortical dysplasia"
  authors: "Ana Aquiles, Tatiana Fiordelisio, Hiram Luna-Munguia and Luis Concha"
  venue: "Scientific Reports"
  link: "https://doi.org/10.1038/s41598-023-38717-2"
  pdf: "/assets/papers/SciRep2023.pdf"
  abstract: "Focal cortical dysplasias (FCDs) are malformations of cortical development that often result in medically refractory epilepsy, with a greater incidence in the pediatric population. The relationship between the disturbed cortical morphology and epileptogenic activity of FCDs remains unclear..."

