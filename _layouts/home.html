---
layout: default
---
<div class="home">
  <div class="hero-grid">
    <div class="hero">
      {{ content }}
    </div>
    {% if page.photo %}
    <div class="hero-photo">
      <img src="{{ page.photo | relative_url }}" alt="{{ site.title }}">
    </div>
    {% endif %}
  </div>

  {% if site.posts.size > 0 %}
  <section class="index-section">
    <span class="eyebrow">Journal — latest</span>
    <ul class="index-list">
      {% for post in site.posts limit:3 %}
      <li class="index-list__item">
        <a href="{{ post.url | relative_url }}">
          <span class="index-list__date">{{ post.date | date: "%b %-d, %Y" }}</span>
          <span class="index-list__title">{{ post.title }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
    <a class="text-link" href="{{ '/blog/' | relative_url }}">All entries →</a>
  </section>
  {% endif %}
</div>
